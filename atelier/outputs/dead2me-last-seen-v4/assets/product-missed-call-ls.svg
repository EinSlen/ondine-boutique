    <filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".027" numOctaves="4" seed="31" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="mono"/><feBlend in="SourceGraphic" in2="mono" mode="soft-light"/></filter>
