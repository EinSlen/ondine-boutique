    <dc:source>Judge magazine number 2044, 1 January 1921, page 9: https://hdl.handle.net/2027/mdp.39015068416422?urlappend=%3Bseq=15</dc:source>
    <dc:description>A silhoutte of two bald men sitting in chairs on either side of a desk smoking cigars.  A candlestick telephone is on the desk and one man has a bowler hat in his hand. Taken from Judge magazine number 2044, 1 January 1921, page 9 (https://hdl.handle.net/2027/mdp.39015068416422?urlappend=%3Bseq=15); illustrator is listed as J. K. Bryans and the caption of the image is "That chap Boggs doesn't seem to have any aim in life." "His aim is all right, but he doesn't know when to shoot."</dc:description>
    <dc:contributor>
     <cc:Agent>
      <dc:title>J. K. Bryans and openclipart.org user |</dc:title>
     </cc:Agent>
    </dc:contributor>
