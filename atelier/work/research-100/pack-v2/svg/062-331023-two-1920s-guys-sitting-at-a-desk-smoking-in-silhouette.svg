    <dc:title>Two 1920s guys sitting at a desk smoking in silhouette</dc:title>
    <cc:license rdf:resource="http://creativecommons.org/publicdomain/zero/1.0/"/>
    <dc:date>1921</dc:date>
    <dc:creator>
     <cc:Agent>
