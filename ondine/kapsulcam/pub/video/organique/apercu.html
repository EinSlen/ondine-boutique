<h1>Films organiques TikTok / Reels</h1>
<p>Muets : le son se choisit dans l'appli. Un film par activité, une personne qui se filme, fin « tu vis. elle filme. ».</p>
<div class="row">
  <figure><video src="kapsulcam-film-snow-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>Snowboard</b><br>Pov : t'es le pote qui filme toute la journée</figcaption></figure>
  <figure><video src="kapsulcam-film-ours-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>Costumes</b><br>Pov : t'as perdu un pari contre tes potes</figcaption></figure>
  <figure><video src="kapsulcam-film-moto-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>Moto</b><br>Pov : on avait dit « on rentre avant la pluie »</figcaption></figure>
  <figure><video src="kapsulcam-film-vtt-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>VTT</b><br>Pov : t'as dit « juste une petite sortie »</figcaption></figure>
  <figure><video src="kapsulcam-film-mer-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>Mer</b><br>Pov : t'as enfin posé tes congés</figcaption></figure>
  <figure><video src="kapsulcam-film-piscine-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>Piscine</b><br>Pov : 35 °C et une piscine rien que pour toi</figcaption></figure>
  <figure><video src="kapsulcam-film-voiture-9x16.mp4" controls loop muted autoplay playsinline></video><figcaption><b>Voiture</b><br>Pov : quelqu'un te rentre dedans et c'est sa parole contre la tienne, puis « sauf que toi, t'as tout filmé », fin « tu roules. elle filme. »</figcaption></figure>
