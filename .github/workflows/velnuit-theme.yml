name: VELNUIT theme

on:
  pull_request:
    paths:
      - 'velnuit/**'
      - '.github/workflows/velnuit-theme.yml'
  push:
    branches: [main]
    paths:
      - 'velnuit/**'
      - '.github/workflows/velnuit-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            velnuit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify structure, translations and JavaScript
        run: node velnuit/tools/verify-theme.mjs
      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@3
      - name: Check Liquid and Shopify theme rules
        working-directory: velnuit/theme
        run: shopify theme check --fail-level error
      - name: Package Shopify theme
        working-directory: velnuit/theme
        run: shopify theme package
      - uses: actions/upload-artifact@v4
        with:
          name: VELNUIT-shopify-theme
          path: velnuit/theme/*.zip
          if-no-files-found: error
